plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // 产物名：command-control-1.0.0.jar（modId 必须是下划线形式，见 gradle.properties 注释）
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// ---------------------------------------------------------------------------
// 依赖仓库（按顺序回退：Gradle 在某个仓库 404 时会继续试下一个）
//   1. local-maven：本地补丁仓库，只有一个 net.neoforged:minecraft-dependencies:1.21.1
//      （该 pom 只在官方 maven 上有，所有可达镜像都缺；内容就是 Mojang 版本清单里的
//       Minecraft 库列表，用 tools/gen-minecraft-dependencies.ps1 从清单重建）
//   2. BMCLAPI：NeoForge 发布件（neoforge userdev/universal、AutoRenamingTool 等）
//   3. StellarDrift internal maven：含 NeoForm 运行库（neoform-runtime）与 cpw.mods 组件
//   4. MinecraftForge maven：net.minecraftforge:mergetool 等 Forge 侧工具
//   5. Mojang libraries：com.mojang:* 等 Minecraft 库
//   6. Cloth Config / Modrinth / Maven Central
// 官方 maven.neoforged.net 在部分网络下不可达，插件会自动加上它，这里把它摘掉。
// ---------------------------------------------------------------------------
repositories {
    maven {
        name = 'Local NeoForged shim'
        url = uri("${rootDir}/local-maven")
        content { includeGroupByRegex 'net\\.neoforged.*' }
    }
    maven {
        name = 'BMCLAPI NeoForged Mirror'
        url = 'https://bmclapi2.bangbang93.com/maven/'
        content { includeGroupByRegex 'net\\.neoforged.*' }
    }
    maven {
        name = 'StellarDrift (NeoForm runtime)'
        url = 'https://repo.stellardrift.ca/maven/internal/'
        content {
            includeGroupByRegex 'net\\.neoforged.*'
            includeGroupByRegex 'cpw\\.mods.*'
        }
    }
    maven {
        // neoform-runtime 的运行期依赖还有 Forge 的 mergetool/installertools
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroupByRegex 'net\\.minecraftforge.*' }
    }
    maven {
        name = 'Mojang libraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'Shedaniel (Cloth Config)'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

// moddev 插件会自动加入官方 maven.neoforged.net；在部分网络下它不可达且会先撞超时，
// 所以这里把它摘掉，只保留上面两个可用镜像。
def dropUnreachableNeoForgedRepo = {
    repositories.removeIf { repo ->
        repo instanceof MavenArtifactRepository &&
                repo.url != null &&
                repo.url.toString().contains('maven.neoforged.net')
    }
}
dropUnreachableNeoForgedRepo()
afterEvaluate { dropUnreachableNeoForgedRepo() }

dependencies {
    // Cloth Config API（NeoForge 1.21.1 对应 15.x）。
    // 只用 compileOnly + runtimeOnly：配置界面是客户端可选功能，
    // 依赖 jar 不会被塞进本模组的产物里，也不会把 Cloth 变成硬前置。
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 只在 neoforge.mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何“美元号+花括号”片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    // 展开值来自 gradle.properties；显式声明它，避免改了版本号却因为“任务已是最新”而不重新展开。
    // 注意不要用 inputs.properties(project.properties)：里面含 moddev 的内部对象，无法序列化。
    inputs.file('gradle.properties')
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

// 发布副本：`gradlew dist` 把构建产物复制到 dist/，避免 gradlew clean 把历史版本一起删掉。
tasks.register('dist', Copy) {
    dependsOn tasks.named('build')
    from tasks.named('jar')
    into layout.projectDirectory.dir('dist')
    doLast {
        logger.lifecycle("已复制发布包到 dist/：" + tasks.named('jar').get().archiveFileName.get())
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
