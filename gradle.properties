org.gradle.jvmargs=-Xmx2G

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
# 21.1.233 属于 NeoForge 1.21.1 线（mods.toml 的 versionRange 写成 [21.1,) 覆盖全线）。
minecraft_version=1.21.1
neo_version=21.1.233

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# 第三方前置
cloth_config_version=15.0.140

# Mod metadata
#   署名：所有者 lyhyy2007，程序提供 deepseek
#   注意：NeoForge 的 modId 只允许 ^[a-z][a-z0-9_]{1,63}$（见 FML ModInfo.VALID_MODID），
#   带连字符会被判为 InvalidModFileException 直接拒载，所以 modId 用下划线，
#   对外显示名 / 产物名用 command-control。
mod_id=command_control
mod_name=Command Control
mod_archive_name=command-control
mod_version=1.0.4
mod_group_id=com.lyhyy2007.commandcontrol
mod_authors=lyhyy2007
mod_license=MIT
mod_description=Server-side command guard: allow/deny commands per preset for every game mode (survival/creative/adventure/spectator), blocks game-mode switching (F3+F4) and command blocks, with Cloth Config screen and Configured support. Owner lyhyy2007, program provider deepseek. NOTE: keep this value ASCII-only (Gradle reads gradle.properties as ISO-8859-1).
